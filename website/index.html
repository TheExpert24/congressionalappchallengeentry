<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <title>Congressional App Challenge Entry</title>
</head>
<body>
    <h1>Congressional App Challenge Entry</h1>
    <p>It is hard to find opportunities for your child or for yourself. But we make it simple.</p>

    <div class="filters" aria-label="Opportunity filters">
        <div class="filter-group search-group">
            <label for="searchInput">Search</label>
            <input id="searchInput" type="search" placeholder="Search opportunities...">
        </div>
        <div class="filter-group">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="gradeFilter">Grade</label>
            <select id="gradeFilter">
                <option value="">All Grades</option>
            </select>
        </div>

        <button id="clearFilters" type="button" class="clear-button2">Clear</button>
    </div>

    <main id="opportunities"></main>
</body>
</html>
